[project]
name = "uzbek-ner"
version = "0.1.0"
description = "Uzbek NER — ITMO × Brand Analytics hackathon"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Daniil Sereda", email = "marvolo04@mail.ru" }]
dependencies = [
    "accelerate>=1.4",
    "datasets>=3.0",
    "dvc>=3.59",
    "fastapi>=0.115",
    "gliner>=0.2",
    "httpx>=0.28",
    "hydra-core>=1.3",
    "loguru>=0.7",
    "mlflow>=3.0",
    "omegaconf>=2.3",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.8",
    "python-dotenv>=1.1",
    "rich>=13.9",
    "scikit-learn>=1.5",
    "seqeval>=1.2",
    "torch>=2.6",
    "transformers>=4.51",
    "typer>=0.15",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "mypy>=2.3.1",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.9",
]
# Slim Docker image: HTTP runtime only (no torch / transformers / HuggingFace).
service = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
ner = "uzbek_ner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uzbek_ner"]

[tool.ruff]
# Paths must stay in sync with Makefile / CI / pre-commit: src tests scripts
src = ["src", "tests", "scripts"]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "checkpoints", "models", "mlruns", ".dvc", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PIE"]
ignore = [
    "E501",
    "RUF002",  # project branding uses ×
    "RUF003",  # project copy uses en/em dashes
]

[tool.ruff.lint.isort]
known-first-party = ["uzbek_ner"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
# `uv run mypy` (Makefile typecheck / lint, CI, pre-commit) uses this list.
files = ["src"]
exclude = ["(?x)(^tests/|^scripts/|^data/|^checkpoints/|^models/|^mlruns/)"]
show_error_codes = true
pretty = true
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
no_implicit_reexport = true
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "datasets",
    "datasets.*",
    "mlflow",
    "mlflow.*",
    "hydra",
    "hydra.*",
    "omegaconf",
    "omegaconf.*",
    "gliner",
    "gliner.*",
    "seqeval",
    "seqeval.*",
    "accelerate",
    "accelerate.*",
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-markers"]

[tool.uv]
package = true
