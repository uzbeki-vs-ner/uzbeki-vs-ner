# Hydra-конфиг по умолчанию. Переопределение:
#   uv run ner train --config-name default train.epochs=5

defaults:
  - _self_

seed: ${oc.env:SEED,42}

paths:
  data_raw: data/raw
  data_processed: data/processed
  checkpoints: checkpoints
  models: models
  metrics: metrics.json

mlflow:
  tracking_uri: ${oc.env:MLFLOW_TRACKING_URI,sqlite:///mlflow.db}
  experiment: ${oc.env:MLFLOW_EXPERIMENT,uzbek_ner}
  smoke_experiment: ${oc.env:MLFLOW_SMOKE_EXPERIMENT,uzbek_ner_smoke}

prepare:
  max_length: 512
  stride: 128

train:
  model_name: rifkat/uztext-3Gb-BPE-Roberta
  learning_rate: 2.0e-5
  batch_size: 16
  epochs: 3
  weight_decay: 0.01
  warmup_ratio: 0.1

evaluate:
  batch_size: 32
  gold: data/official/dev.jsonl
  predictions: outputs/official/dev_predictions.jsonl
  metrics_out: outputs/official/dev_metrics.json
  run_id: dvc_evaluate
  split: official_dev

# Separate from train: encode official dev, cache logits, sweep span-confidence τ.
calibrate:
  checkpoint: checkpoints/uztext_smoke
  cache_dir: outputs/cache/uztext_smoke_official_dev
  gold: data/official/dev.jsonl
  output: outputs/eval/threshold.json
  metrics_out: threshold_metrics.json
  fill_cache: true
  taus: [0.0, 0.3, 0.5, 0.7]
  k: 5
  seed: 42
  batch_size: 8
  max_length: 512
  stride: 128
