global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
# Eval API runs on the host (make eval-api → :8050).
# Compose uses host networking so Prometheus scrapes loopback, not Docker DNS.
  - job_name: uzbek-ner-eval
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["127.0.0.1:8050"]
