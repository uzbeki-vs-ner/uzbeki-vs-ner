name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Lint / typecheck / unit tests only. Do not download models or datasets,
# and do not start an MLflow server.
#
# Command source of truth: Makefile. This workflow pins Python 3.11 and
# `uv sync --frozen --all-groups`, then runs `make lint` + `make test`
# (ruff check → ruff format --check → mypy → pytest).
env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  UV_LINK_MODE: copy

jobs:
  lint-and-test:
    name: ruff / mypy / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv (Python 3.11, cache)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      - name: Lint (ruff check, ruff format, mypy)
        run: make lint

      - name: Tests
        run: make test
